<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
    <head th:replace="~{general/fragmentos :: head}"/>
    <body>
        <header th:replace="~{general/fragmentos :: header}"/>

        <section th:replace="~{producto/fragmentos :: agregar}"/>

        <div class="container my-4">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0"><i class="fas fa-search"></i> Filtrar por rango de precio </h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/producto/queryAmpliada}" method="POST" class="row g-3">
                        <div class="col-md-4">
                            <label for="precioInf" class="form-label font-weight-bold">Precio Mínimo:</label>
                            <div class="input-group">
                                <span class="input-group-text">¢</span>
                                <input type="number" class="form-control" name="precioInf" th:value="${precioInf}" step="0.01" required/>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label for="precioSup" class="form-label font-weight-bold">Precio Máximo:</label>
                            <div class="input-group">
                                <span class="input-group-text">¢</span>
                                <input type="number" class="form-control" name="precioSup" th:value="${precioSup}" step="0.01" required/>
                            </div>
                        </div>
                        <div class="col-md-4 d-flex align-items-end">
                            <button type="submit" class="btn btn-success w-100 shadow-sm">
                                <i class="fas fa-filter"></i> Aplicar Filtro
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <section th:replace="~{producto/fragmentos :: listado}"/>

        <section th:replace="~{producto/fragmentos :: confirmarEliminar}"/>
        <section th:replace="~{general/fragmentos :: mostrarToast}"/>

        <footer th:replace="~{general/fragmentos :: footer}"/>

    </body>
</html>
